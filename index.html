<!DOCTYPE html>
<html lang="pt-BR" style="background-color: #090909d2">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" id="favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Persona Craft</title>
    <script id="global-error-handler">
      (function () {
        let errorShown = false;
        function showErrorUI(error) {
          if (errorShown) return;
          errorShown = true;

          const errorMessage =
            error instanceof Error
              ? error.message
              : String(error || "Unknown error");
          const stack =
            error instanceof Error && error.stack ? error.stack : "";
          const root = document.getElementById("root");
          const target = root || document.body;
          if (target) {
            target.innerHTML = `
              <div style="
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 20px;
                font-family: system-ui, -apple-system, sans-serif;
                background-color: #0a0a0a;
                color: #ffffff;
              ">
                <div style="
                  max-width: 600px;
                  padding: 30px;
                  background-color: #1a1a1a;
                  border-radius: 8px;
                  border: 1px solid #333;
                ">
                  <h1 style="margin-top: 0; color: #ff6b6b;">⚠️ Application Error</h1>
                  <p style="margin-bottom: 20px;">Something went wrong and the application failed to load.</p>
                  <details style="margin-bottom: 20px;">
                    <summary style="cursor: pointer; margin-bottom: 10px; user-select: none;">Error Details</summary>
                    <pre style="
                      background-color: #0a0a0a;
                      padding: 15px;
                      border-radius: 4px;
                      overflow-x: auto;
                      font-size: 12px;
                      color: #ff6b6b;
                      white-space: pre-wrap;
                      word-wrap: break-word;
                    ">${errorMessage}${stack ? "\n\n" + stack : ""}</pre>
                  </details>
                  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="window.location.reload()" style="
                      padding: 10px 20px;
                      background-color: #4a9eff;
                      color: white;
                      border: none;
                      border-radius: 4px;
                      cursor: pointer;
                      font-size: 16px;
                    ">Reload Page</button>
                    <button onclick="window.location.href='/'" style="
                      padding: 10px 20px;
                      background-color: #666;
                      color: white;
                      border: none;
                      border-radius: 4px;
                      cursor: pointer;
                      font-size: 16px;
                    ">Go Home</button>
                  </div>
                </div>
              </div>
            `;

            document.body.style.opacity = "1";
          }
        }
        window.addEventListener("unhandledrejection", function (event) {
          console.error("Unhandled promise rejection:", event.reason);
          showErrorUI(event.reason);
          event.preventDefault();
        });
        window.addEventListener("error", function (event) {
          console.error("Global error:", event.error || event.message);
          showErrorUI(event.error || event.message);
          event.preventDefault();
        });
        setTimeout(function () {
          const root = document.getElementById("root");
          const body = document.body;

          const hasContent =
            root &&
            (root.children.length > 0 ||
              (root.textContent && root.textContent.trim().length > 0));

          if (body.style.opacity === "0" || !hasContent) {
            showErrorUI("Application failed to render within 3 seconds");
          }
        }, 3000);
      })();
    </script>
  </head>
  <body style="opacity: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  <span id="primaryModalContainer"></span>
  <span id="secondaryModalContainer"></span>
  <span id="primaryToastContainer"></span>
  <span id="secondaryToastContainer"></span>
  <span id="tipsToastContainer" style="display: none"></span>
  <span id="swipePortalPrev" style="display: none"></span>
  <span id="swipePortalNext" style="display: none"></span>
</html>
